plugin:
  name: formula-columns
  url: https://github.com/programmfabrik/fylr-plugin-formula-columns
  version: "2"
  l10n: l10n/fylr-plugin-formula-columns.csv
  displayname:
    de-DE: Formula Columns
    en-US: Formula Columns
  webfrontend:
    url: FormulaColumns.js
    css: FormulaColumns.css

base_url_prefix: "webfrontend"

callbacks:
  db_pre_save:
    steps:
      - name: "execute formula columns"
        callback: formula_columns
    callbacks:
      formula_columns:
        plugin_user:
          base_config: "user.api_user"
        exec:
          service: "node"
          commands:
            - prog: "node"
              stdin:
                type: body
              stdout:
                type: body
              args:
                - type: "value"
                  value: "%_exec.pluginDir%/server/FormulaColumnsServer.js"
                - type: "value"
                  value: "%info.json%"

# POST /api/v1/plugin/extension/formula-columns/test runs a formula once
# against a given object, without saving, for the preview in the datamodel editor.
extensions:
  test:
    plugin_user:
      base_config: "user.api_user"
    exec:
      service: "node"
      commands:
        - prog: "node"
          stdin:
            type: body
          stdout:
            type: body
          args:
            - type: "value"
              value: "%_exec.pluginDir%/server/FormulaColumnsTest.js"
            - type: "value"
              value: "%info.json%"

custom_events:
  FORMULA_COLUMNS_DEBUG: {}
  FORMULA_COLUMNS_ERROR: {}

base_config:
  - name: user
    parameters:
      api_user:
        type: user

# Release workflow for a PUBLIC fylr plugin (canonical template:
# fylr-build-plugin/templates/release-public.yaml). A manager publishes a
# release on the GitHub release page; this builds the plugin zip and attaches
# it — fylr installs from releases/latest/download/<repo>.zip.
name: Release

on:
  release:
    types:
      - published
      - edited

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install CoffeeScript and sass
        run: sudo npm install -g coffeescript@1.12.7 sass

      - name: Install golang
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          # a plugin repo has no go.mod for the dependency cache to key on
          cache: false

      - name: Build and package
        run: make zip
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Attach plugin zip to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/*.zip

  # Tell the fylr Plugin Marketplace about the release once the zip is
  # reachable, so the catalog lists its tag, date and sha256 within minutes.
  # FYLR_BOT_PERSONAL_ACCESS_TOKEN is a programmfabrik organization secret;
  # elsewhere it is empty and notify-release only prints a notice.
  marketplace:
    if: "!github.event.release.prerelease"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Install golang
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false

      - name: Notify the marketplace
        run: go run github.com/programmfabrik/fylr-build-plugin@latest notify-release -repo "$GITHUB_REPOSITORY" -tag "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ secrets.FYLR_BOT_PERSONAL_ACCESS_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
